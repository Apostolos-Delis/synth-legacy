name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Cross-compilation needs native modules for all target platforms.
      # bun skips optional deps whose os/cpu don't match the host, so
      # darwin packages are missing on the Linux runner. npm --force
      # bypasses os/cpu constraints.
      - name: Install cross-platform native deps
        run: |
          OPENTUI_VER=$(grep '"version"' node_modules/@opentui/core/package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          for pkg in core-darwin-arm64 core-darwin-x64 core-linux-arm64 core-linux-x64; do
            if [ ! -d "node_modules/@opentui/$pkg" ]; then
              echo "Installing @opentui/$pkg@$OPENTUI_VER"
              npm install --no-save --force "@opentui/$pkg@$OPENTUI_VER"
            fi
          done

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build all targets
        run: |
          bun run build:darwin-arm64
          bun run build:darwin-x64
          bun run build:linux-arm64
          bun run build:linux-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/synth-darwin-arm64
            dist/synth-darwin-x64
            dist/synth-linux-arm64
            dist/synth-linux-x64
