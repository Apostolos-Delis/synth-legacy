name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Cross-compilation needs native modules for all target platforms.
      # bun install skips optional deps that don't match the host OS/arch,
      # so we manually fetch the ones the host is missing.
      - name: Install cross-platform native deps
        run: |
          OPENTUI_VER=$(bun pm ls | grep '@opentui/core@' | sed -E 's/.*@opentui\/core@([0-9.]+).*/\1/')
          for pkg in core-darwin-arm64 core-darwin-x64 core-linux-arm64 core-linux-x64; do
            if [ ! -d "node_modules/@opentui/$pkg" ]; then
              echo "Installing @opentui/$pkg@$OPENTUI_VER"
              bun add --no-save "@opentui/$pkg@$OPENTUI_VER"
            fi
          done

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build all targets
        run: |
          bun run build:darwin-arm64
          bun run build:darwin-x64
          bun run build:linux-arm64
          bun run build:linux-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/synth-darwin-arm64
            dist/synth-darwin-x64
            dist/synth-linux-arm64
            dist/synth-linux-x64
